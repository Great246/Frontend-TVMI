<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/src/style.css">
    <link rel="stylesheet" href="/remixicon/remixicon.css">
</head>
<body >
    <div class="flex w-screen h-screen justify-center items-center">
    <form id="resetform" class="flex justify-center items-center gap-3 flex-col shadow-2xl p-3 text-black rounded-md bg-white/10 backdrop-blur-xl border border-white/20 w-70 md:w-85 lg:w-95 m-3">
     <h1 class="text-black mb-2 text-2xl font-bold">Create new Password</h1>
     <div class="relative">
        <input type="password" placeholder="New Password" id="password" class="border focus:outline-none rounded-md w-65 md:w-80 lg:w-90 text-sm py-1.5 pl-3 pr-10"/>
        <i class="ri-lock-line absolute top-1/2 right-3 -translate-y-1/2"></i>
     </div>
     <div class="relative">
        <input type="password" placeholder="Confirm New Password" id="confirmPassword" class="border focus:outline-none rounded-md w-65 md:w-80 lg:w-90 text-sm py-1.5 pl-3 pr-10"/>
        <i class="ri-lock-line absolute top-1/2 right-3 -translate-y-1/2"></i>
     </div>

     <a href="/auth/register.html"><h2 class="text-sm">Don't have an account? <span class="text-yellow-500 ml-1 text-[17px] font-extrabold">Sign up</span></h2></a>
   <button type="submit" class="bg-yellow-500 text-white py-1.5 rounded-sm px-3">Send Reset Link</button>

    </form>
    <div id="loading" class="hidden fixed inset-0 z-[9999] bg-black/30 items-center justify-center">
        
        <div class="w-12 h-12 border-4 border-gray-100 border-t-yellow-500 rounded-full animate-spin">
        </div>
    </div>
    </div>

    <script type="module" src="/src/jsworkers/resetpassword.js"></script>
    <script type="module" src="/src/api/axios.js"></script>
    </body>
  </html>
